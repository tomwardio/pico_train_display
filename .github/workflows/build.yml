name: Build
on: [push]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PICOTOOL_FETCH_FROM_GIT_PATH: ${{ github.workspace }}/picotool
    steps:
    - uses: actions/checkout@v7
      with:
        path: main
    - name: Checkout MicroPython
      uses: actions/checkout@v7
      with:
        repository: micropython/micropython
        ref: refs/tags/v1.29.0
        path: micropython
    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake gcc-arm-none-eabi \
          libnewlib-arm-none-eabi build-essential
    - name: Build Cross-compiler
      run: |
        make -j $(nproc) -C micropython/mpy-cross
    - name: Get MicroPython submodules
      run: |
        make -C micropython/ports/rp2 BOARD=RPI_PICO_W submodules
    - name: Build MicroPython with manifest.
      run: |
        make -j $(nproc) -C micropython/ports/rp2 BOARD=RPI_PICO_W \
          FROZEN_MANIFEST="${GITHUB_WORKSPACE}/main/manifest.py"
    - name: Rename UF2
      run: |
        mv micropython/ports/rp2/build-RPI_PICO_W/firmware.uf2 \
          micropython/ports/rp2/build-RPI_PICO_W/pico_train_display.uf2
    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: pico_train_display
        path: micropython/ports/rp2/build-RPI_PICO_W/pico_train_display.uf2
    - name: Release
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: micropython/ports/rp2/build-RPI_PICO_W/pico_train_display.uf2
